<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feature Support Plan - Reference</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Modern CSS Lab</p>
      <h1>Plan for support, then enhance</h1>
      <p class="intro">This help panel remains usable when anchor positioning is unavailable.</p>
      <button class="help-trigger" type="button" popovertarget="help-panel">Open layout help</button>
      <aside id="help-panel" class="help-panel" popover>
        <h2>Layout hint</h2>
        <p>Start with a readable fallback before adding the anchored position.</p>
      </aside>
    </main>
  </body>
</html>
