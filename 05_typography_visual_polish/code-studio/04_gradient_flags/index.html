<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Gradient Flag Challenge</title><link rel="stylesheet" href="styles.css" /></head>
  <body><main><header><p class="eyebrow">Lesson 05</p><h1>Gradient Flag Challenge</h1></header><div class="flag-grid">
    <figure><div class="flag colombia" role="img" aria-label="Flag of Colombia"></div><figcaption>Colombia</figcaption></figure>
    <figure><div class="flag italy" role="img" aria-label="Flag of Italy"></div><figcaption>Italy</figcaption></figure>
    <figure><div class="flag zimbabwe" role="img" aria-label="Simplified flag of Zimbabwe"><span class="flag-star" aria-hidden="true">&#9733;</span></div><figcaption>Zimbabwe</figcaption></figure>
    <figure><div class="flag tanzania" role="img" aria-label="Flag of Tanzania"></div><figcaption>Tanzania</figcaption></figure>
    <figure><div class="flag usa" role="img" aria-label="Simplified flag of the United States"></div><figcaption>United States</figcaption></figure>
    <figure><div class="flag switzerland" role="img" aria-label="Flag of Switzerland"></div><figcaption>Switzerland</figcaption></figure>
  </div></main></body>
</html>
