<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Form Foundations</title><link rel="stylesheet" href="styles.css" /></head><body><main><header><p class="eyebrow">Lesson 07</p><h1>Artist Event Booking</h1><p>Repair the form markup before styling it.</p></header>
  <!-- TASK: add action and method. -->
  <form>
    <div class="field"><span>Full name</span><input /></div>
    <div class="field"><span>Email</span><input /></div>
    <div class="field"><span>Phone</span><input /></div>
    <div class="field"><span>Portfolio URL</span><input /></div>
    <div class="field"><span>Visit date</span><input /></div>
    <div class="field"><span>Arrival time</span><input /></div>
    <div class="field"><span>Guest count</span><input /></div>
    <div class="field"><span>Interest level</span><input /></div>
    <div class="field"><span>Badge color</span><input /></div>
    <div class="field"><span>Accessibility document</span><input /></div>
    <div class="ticket-group"><p>Ticket type</p><input type="radio" /> Student <input type="radio" /> Standard <input type="radio" /> Supporter</div>
    <div class="field"><span>Preferred session</span><select><option>Morning</option><option>Afternoon</option><option>Evening</option></select></div>
    <div class="field"><span>Message</span><textarea rows="5"></textarea></div>
    <div class="check-row"><input type="checkbox" /> Send event updates</div>
    <button>Reserve a place</button>
  </form>
</main></body></html>
