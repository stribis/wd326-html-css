<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Responsible Iframe - Solution</title><link rel="stylesheet" href="styles.css" /></head><body><main><header><p class="eyebrow">Lesson 07</p><h1>Responsible Iframe</h1><p>An iframe is useful when a separately owned document must remain isolated.</p></header><section><h2>Venue information</h2><!-- The title names the frame; empty sandbox applies the strictest restrictions. --><div class="embed-frame"><iframe src="venue.html" title="Studio Hall A venue and accessibility information" loading="lazy" sandbox></iframe></div><p><a href="venue.html">Open venue information without the iframe</a></p></section></main></body></html>
