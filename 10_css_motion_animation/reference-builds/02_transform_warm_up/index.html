<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transform Warm-Up - Reference</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Transform Lab</p>
      <h1>Change the painted result</h1>
      <section class="tile-grid" aria-label="Transform exercises">
        <article class="tile translate"><span>01</span><h2>Translate</h2></article>
        <article class="tile rotate"><span>02</span><h2>Rotate</h2></article>
        <article class="tile scale"><span>03</span><h2>Scale</h2></article>
        <article class="tile origin"><span>04</span><h2>Origin</h2></article>
        <article class="tile order-a"><span>05A</span><h2>Move, then rotate</h2></article>
        <article class="tile order-b"><span>05B</span><h2>Rotate, then move</h2></article>
      </section>
    </main>
  </body>
</html>
